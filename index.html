<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HNG-FE-STAGE-0</title>
    
    <link rel="preload" as="image" href="image/profile.jpg">
    <link rel="dns-prefetch" href="//x.com">
    <link rel="dns-prefetch" href="//www.linkedin.com">
    <link rel="stylesheet" href="./styles.css">
    <style>
        * { 
  margin: 0;
  font-weight: 400;
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  font-size: var(--customFontSize, 18px)
}

        @media (max-width: 1252px) {
  * {
    --customFontSize: 16px;
  }
 }


        :root {
            max-block-size: 100svh;
        }

        body {
            max-block-size: 100%;
            background-color: deepskyblue;
        }

        /* CSS Rules for the article */
        [data-testid="test-profile-card"] {
            display: flex;
            border-block-start: 2px solid deepskyblue;
            border-inline-end: 2px solid deepskyblue;
            border-radius: 15px;
            overflow: clip;
            background-color: white;
            margin: 10svh auto calc(100svh / 3) auto;
            max-inline-size: calc(100svw/1.5);
        }

        /* Rules for container of all elements except the figure; Last child out of two of article + rule for time & bio */
        #text-info {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            
            [data-testid="test-user-bio"] {
                color: lightgray;
            }
            [data-testid="test-user-time"] {
                background-color: lightblue;
                border-radius: 5px;
                color: deepskyblue;
                padding: 4px 1em 8px 0.5em;
                box-shadow: 0 3px skyblue;
            }    
        }

        /* Rule for header/h2; article descendant; Sibling of social links ul in subsection of text-info */
        [data-testid="test-user-name"] {
            word-spacing: -0.25em;
        }

        /* Rule for ul container of social links */
        [data-testid="test-user-social-links"] {
            height: min-content;
        }

        /* socila link siblings in a flex container */
        [data-testid="test-user-social-X"],[data-testid="test-user-social-LinkedIn"] {
            width: 2em;
            height: min-content;    
        }

        /* rule for social link 1 */
        [data-testid="test-user-social-X"] {
            background-color: aquamarine
        }

        /* rule for social link 2 */
        [data-testid="test-user-social-LinkedIn"] {
            margin-inline-start: 2px;
            background-color: deeppink;
        }
        
        /* container of header & social links ul */
        #primary-user-info {
            display: flex;
            [data-testid="test-user-name"] {
                font-weight: 700;
                font-family: cursive;
            }
            [data-testid="test-user-social-links"] {
                display: flex;
                list-style-type: none;
            }
        }

        /* siblings of flexbox: #tetiary-user-info */
        [data-testid="test-user-hobbies"], [data-testid="test-user-dislikes"] {
            font-weight: 700;
        }

        /* Tertiary info; Parent of hobbies & dislikes */
        #tetiary-user-info {
            display: flex;
            margin-block-end: 1em;
        }

        /* child1 of tetiary-user-info */
        #tetiary-user-info > :first-child {
            flex: 1 1 1px;
            padding-block-end: 2em;
            h3 {font-size: clamp(1rem ,7.5vw, 2rem);}
            ul {list-style-type: none; padding-inline-start: 0;}
        }

        /* child2 of tetiary-user-info */
        #tetiary-user-info > :nth-of-type(even) {
            padding-inline-start: 1em;
            padding-block-end: 2em;
            background-color: lightblue;
            color: beige;
            flex: 1 1 1px;
            h3 {font-size: clamp(1rem ,7.5vw, 2rem);}
            ul {list-style-type: none; padding-inline-start: 0;}
        }

        /* Set margin-bottom */
        [data-testid="test-user-bio"],[data-testid="test-user-time"],#primary-user-info {
            margin-block-end: 0.25rem;
        }

        /* Laptop */
        @media (min-width: 1252px) {
            [data-testid="test-profile-card"] {
                max-height: calc(50svh);
                margin: 10svh auto calc(100svh/3) auto;
                padding-inline-end: 12px;
                box-shadow: -10px 10px;
            }
            
            #text-info {
                margin-inline-start: 8px;
            }

            figure {
                max-height: 100%;
                flex: 2 1 0;
                overflow: clip;
            }

            [data-testid="test-user-social-links"] {
                padding-inline-start: calc(1em/4);
            }

            [data-testid="test-user-avatar"] {
                overflow: clip;   
            }

            [data-testid="test-user-avatar"] {
                filter: grayscale(1);
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            [data-testid="test-user-avatar"]:hover {
                filter: none;
            }
            
            [data-testid="test-user-name"] {
                font-size: 36px;
            }

            [data-testid="test-user-social-X"],[data-testid="test-user-social-LinkedIn"] {
                margin-block-start: 11px;
            }

            [data-testid="test-user-bio"] {
                max-inline-size: 50ch
            }

            #navButton {
                flex: 1 1 1px;
                display: flex;
                flex-direction: column;
                background: repeating-linear-gradient(to bottom right, black 0 15px, transparent 15px 22px);
            }
            #navButton > * {
                flex: 0 1 1px;
                text-align: center;
                padding: 0.5em auto;
                text-decoration: none;
                color: white;
                background-color: blue;
                margin-block-start: 4px;
            }
        }

        /* Mobile */
        @media (max-width: 1252px) {
            [data-testid="test-profile-card"] {
                flex-direction: column;
                box-shadow: 0 5px;
            }

            #text-info {
                padding-inline-start: 4px;
                padding-inline-end: 4px;

                [data-testid="test-user-time"] {
                    text-align: center;
                }                
            }
            
            figure {
                position: relative;
                background-color: aqua;
                padding-inline: auto;
                display: flex;
                justify-content: center;
                margin-block-end: 32px;
            }

            [data-testid="test-user-social-links"] {
                padding-inline-start: 0px;
            }

            [data-testid="test-user-avatar"] {
                width: 4em;
                aspect-ratio: 1;
                object-fit: cover;
                position: relative;
                border: 4px solid white;
                border-radius: 50%;
                inset-block-start: 2em;
            }

            [data-testid="test-user-name"] {
                font-size: clamp(1rem ,7.5vw, 2rem);
            }

            [data-testid="test-user-bio"] {
                max-inline-size: 40em;
                text-align: center;
            }

            #primary-user-info {
                flex-direction: column;
                align-items: center;
            }

            #tetiary-user-info > :first-child {
                h3 {font-size: clamp(1rem ,7.5vw, 2rem);}
            }

            #tetiary-user-info > :nth-of-type(even) {    
                h3 {font-size: clamp(1rem ,7.5vw, 2rem);} 
        }

            #navButton {
                display: flex;
            }
            #navButton > * {
                flex: 1 1 1px;
                text-align: center;
                text-decoration: none;
                color: initial;
            }
            #goToContactButton {
                background-color: aquamarine;
            }
            #goToAboutMeButton {
                background-color: deeppink;
                padding-inline-start: 16px;
            }

        }

        #tetiary-user-info > * ul > * {
            margin-inline-start: 0;
        }
    </style>
</head>
<body>
    <article aria-label="Profile card for Daniel Elufisan" data-testid="test-profile-card">
        <figure>
            <img src="image/profile.jpg" alt="My profile picture" data-testid="test-user-avatar">

            <p data-testid="test-user-bio" aria-label="User biography">
                Aspiring to be a Fullstack Developer right now. Language of choice is Javascript. After that, wanna try embedded and administrator work.

            <p data-testid="test-user-time" id="time"></p>

            
            <div id="tetiary-user-info">
            <section data-testid="test-user-hobbies" aria-label="List of hobbies">
                <h3>

                <ul>
                    <li>Manga</li>

            <section data-testid="test-user-dislikes" aria-label="List of dislikes">
                <h3>

        </div>
        <div id="navButton">
            <a id="goToContactButton" href="./contact-us.html">Contact</a>
            <a id="goToAboutMeButton" href="./about-me.html">About Me</a>
        </div>
    </article>
    
    <script>
        const time = document.getElementById("time")

        time.innerText = currentTime

</body>
</html>
